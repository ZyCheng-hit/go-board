name: Deploy Go Board AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: go-board-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout browser KataGo app
        uses: actions/checkout@v6
        with:
          repository: Sir-Teo/web-katrain
          ref: 35a5113f9b3ade5ce2116884f3a2d00e02c7c77b
          path: app
          lfs: true

      - name: Build private Chinese three-mode UI
        shell: bash
        run: |
          set -euo pipefail

          # -------------------------------------------------------
          # 1. 私人模式状态
          # -------------------------------------------------------
          cat > app/src/store/personalModeStore.ts <<'EOF'
          import { create } from 'zustand';
          import type { CandidateMove } from '../types';

          export type PersonalMode = 'play' | 'position' | 'guide';

          type PersonalModeState = {
            mode: PersonalMode;
            previewMove: CandidateMove | null;
            setMode: (mode: PersonalMode) => void;
            setPreviewMove: (move: CandidateMove | null) => void;
          };

          export const usePersonalModeStore = create<PersonalModeState>((set) => ({
            mode: 'play',
            previewMove: null,
            setMode: (mode) => set({ mode, previewMove: null }),
            setPreviewMove: (previewMove) => set({ previewMove }),
          }));
          EOF

          # -------------------------------------------------------
          # 2. 中文三模式控制条
          # -------------------------------------------------------
          cat > app/src/components/PersonalModeDock.tsx <<'EOF'
          import React, { useEffect, useMemo, useState } from 'react';
          import { useGameStore } from '../store/gameStore';
          import { usePersonalModeStore, type PersonalMode } from '../store/personalModeStore';
          import type { CandidateMove, EditTool } from '../types';

          function moveLabel(move: CandidateMove, boardSize: number): string {
            if (move.x < 0 || move.y < 0) return '虚手';
            const column = String.fromCharCode(65 + (move.x >= 8 ? move.x + 1 : move.x));
            return `${column}${boardSize - move.y}`;
          }

          function scoreText(scoreLead: number): string {
            if (!Number.isFinite(scoreLead) || Math.abs(scoreLead) < 0.05) return '持平';
            const side = scoreLead > 0 ? '黑' : '白';
            return `${side}+${Math.abs(scoreLead).toFixed(1)}目`;
          }

          function candidateLossText(move: CandidateMove, index: number): string {
            if (index === 0) return '最佳';
            const loss = Math.max(0, move.relativePointsLost ?? move.pointsLost ?? 0);
            return `-${loss.toFixed(1)}目`;
          }

          const SETUP_TOOLS: Array<{ tool: EditTool; label: string; icon: string }> = [
            { tool: 'setup-black', label: '黑子', icon: '●' },
            { tool: 'setup-white', label: '白子', icon: '○' },
            { tool: 'setup-alternate', label: '交替', icon: '◐' },
            { tool: 'setup-erase', label: '擦除', icon: '⌫' },
          ];

          export const PersonalModeDock: React.FC = () => {
            const currentNode = useGameStore((state) => state.currentNode);
            const currentPlayer = useGameStore((state) => state.currentPlayer);
            const isAnalysisMode = useGameStore((state) => state.isAnalysisMode);
            const toggleAnalysisMode = useGameStore((state) => state.toggleAnalysisMode);
            const runAnalysis = useGameStore((state) => state.runAnalysis);
            const updateSettings = useGameStore((state) => state.updateSettings);
            const engineStatus = useGameStore((state) => state.engineStatus);
            const navigateBack = useGameStore((state) => state.navigateBack);
            const navigateForward = useGameStore((state) => state.navigateForward);
            const passTurn = useGameStore((state) => state.passTurn);
            const resetGame = useGameStore((state) => state.resetGame);
            const isEditMode = useGameStore((state) => state.isEditMode);
            const toggleEditMode = useGameStore((state) => state.toggleEditMode);
            const editTool = useGameStore((state) => state.editTool);
            const setEditTool = useGameStore((state) => state.setEditTool);
            const isInsertMode = useGameStore((state) => state.isInsertMode);
            const toggleInsertMode = useGameStore((state) => state.toggleInsertMode);

            const mode = usePersonalModeStore((state) => state.mode);
            const previewMove = usePersonalModeStore((state) => state.previewMove);
            const setMode = usePersonalModeStore((state) => state.setMode);
            const setPreviewMove = usePersonalModeStore((state) => state.setPreviewMove);

            const [newGameArmed, setNewGameArmed] = useState(false);
            const analysis = currentNode.analysis ?? null;
            const boardSize = currentNode.gameState.board.length;
            const moveNumber = currentNode.gameState.moveHistory.length;
            const canGoBack = Boolean(currentNode.parent);
            const canGoForward = currentNode.children.length > 0;

            const candidates = useMemo(
              () =>
                [...(analysis?.moves ?? [])]
                  .filter((move) => move.x >= 0 && move.y >= 0)
                  .sort((a, b) => a.order - b.order || b.visits - a.visits)
                  .slice(0, 3),
              [analysis]
            );

            useEffect(() => setPreviewMove(null), [currentNode.id, setPreviewMove]);

            useEffect(() => {
              if (!newGameArmed) return;
              const timer = window.setTimeout(() => setNewGameArmed(false), 2600);
              return () => window.clearTimeout(timer);
            }, [newGameArmed]);

            const stopBoardTools = () => {
              if (isEditMode) toggleEditMode();
              if (isInsertMode) toggleInsertMode();
            };

            const runForMode = (nextMode: Exclude<PersonalMode, 'play'>) => {
              const guide = nextMode === 'guide';
              stopBoardTools();
              updateSettings({
                analysisShowChildren: false,
                analysisShowEval: false,
                analysisShowHints: guide,
                analysisShowPolicy: false,
                analysisShowOwnership: false,
                showAnalysisBar: false,
                katagoVisits: guide ? 250 : 120,
                katagoMaxTimeMs: guide ? 4000 : 2000,
                katagoBatchSize: guide ? 8 : 4,
                katagoTopK: guide ? 3 : 1,
                katagoAnalysisPvLen: guide ? 20 : 0,
              });
              if (!isAnalysisMode) {
                toggleAnalysisMode();
              } else {
                void runAnalysis({
                  force: true,
                  visits: guide ? 250 : 120,
                  maxTimeMs: guide ? 4000 : 2000,
                  batchSize: guide ? 8 : 4,
                  topK: guide ? 3 : 1,
                  analysisPvLen: guide ? 20 : 0,
                });
              }
            };

            const chooseMode = (nextMode: PersonalMode) => {
              setPreviewMove(null);
              setMode(nextMode);
              if (nextMode === 'play') {
                updateSettings({
                  analysisShowChildren: false,
                  analysisShowEval: false,
                  analysisShowHints: false,
                  analysisShowPolicy: false,
                  analysisShowOwnership: false,
                  showAnalysisBar: false,
                });
                if (isAnalysisMode) toggleAnalysisMode();
                return;
              }
              runForMode(nextMode);
            };

            const openSetup = () => {
              if (isInsertMode) toggleInsertMode();
              if (!isEditMode) {
                setEditTool('setup-alternate');
                toggleEditMode();
              } else {
                toggleEditMode();
              }
            };

            const toggleStudy = () => {
              if (isEditMode) toggleEditMode();
              toggleInsertMode();
            };

            const handleNewGame = () => {
              if (!newGameArmed) {
                setNewGameArmed(true);
                return;
              }
              if (isAnalysisMode) toggleAnalysisMode();
              if (isEditMode) toggleEditMode();
              if (isInsertMode) toggleInsertMode();
              setPreviewMove(null);
              setMode('play');
              resetGame();
              setNewGameArmed(false);
            };

            const togglePreview = (move: CandidateMove) => {
              const selected = previewMove?.x === move.x && previewMove?.y === move.y;
              setPreviewMove(selected ? null : { ...move, pv: move.pv?.slice(0, 20) });
            };

            const blackWinRate =
              analysis && Number.isFinite(analysis.rootWinRate)
                ? Math.max(0, Math.min(100, analysis.rootWinRate * 100))
                : null;

            const modeButton = (target: PersonalMode, label: string) => (
              <button
                type="button"
                onClick={() => chooseMode(target)}
                aria-pressed={mode === target}
                className={[
                  'min-h-9 rounded-lg px-3 py-1.5 text-sm font-bold transition-all touch-manipulation',
                  mode === target
                    ? 'bg-[var(--ui-text)] text-[var(--ui-bg)] shadow-sm'
                    : 'text-[var(--ui-text-muted)] hover:bg-[var(--ui-surface-2)] hover:text-[var(--ui-text)]',
                ].join(' ')}
              >
                {label}
              </button>
            );

            const actionClass =
              'min-h-9 rounded-lg border border-transparent px-2.5 py-1.5 text-xs font-semibold text-[var(--ui-text-muted)] transition-all hover:border-[var(--ui-border)] hover:bg-[var(--ui-surface-2)] hover:text-[var(--ui-text)] disabled:cursor-not-allowed disabled:opacity-30 touch-manipulation';

            const activeActionClass =
              'min-h-9 rounded-lg border border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] px-2.5 py-1.5 text-xs font-bold text-[var(--ui-text)] touch-manipulation';

            const refreshCurrentMode = () => {
              if (mode === 'position') runForMode('position');
              if (mode === 'guide') runForMode('guide');
            };

            const aiStatus =
              mode === 'play'
                ? 'AI关闭'
                : engineStatus === 'error'
                  ? 'AI异常'
                  : engineStatus === 'loading'
                    ? '加载中…'
                    : 'KataGo就绪';

            return (
              <section
                className="personal-mode-dock relative z-[75] mx-auto mb-2 mt-2 w-[min(96vw,980px)] rounded-xl border border-[var(--ui-border)] bg-[var(--ui-panel)]/96 px-2.5 py-2 shadow-[0_6px_24px_rgba(15,23,42,0.07)] backdrop-blur-xl"
                aria-label="围棋试下控制台"
              >
                <div className="flex min-w-0 items-center gap-2">
                  <div className="hidden min-w-[105px] shrink-0 sm:block">
                    <div className="truncate text-sm font-black tracking-tight text-[var(--ui-text)]">围棋试下</div>
                    <div className="truncate text-[10px] text-[var(--ui-text-faint)]">
                      第{moveNumber}手 · {currentPlayer === 'black' ? '黑棋行棋' : '白棋行棋'}
                    </div>
                  </div>

                  <div className="grid min-w-0 flex-1 grid-cols-3 rounded-[10px] bg-[var(--ui-surface-2)] p-0.5">
                    {modeButton('play', '下棋')}
                    {modeButton('position', '局势')}
                    {modeButton('guide', 'AI指导')}
                  </div>

                  <div className="hidden shrink-0 items-center gap-1.5 rounded-full border border-[var(--ui-border)] bg-[var(--ui-surface)] px-2 py-1 text-[10px] font-bold text-[var(--ui-text-muted)] sm:flex">
                    <span
                      className={[
                        'h-1.5 w-1.5 rounded-full',
                        mode === 'play'
                          ? 'bg-[var(--ui-text-faint)]'
                          : engineStatus === 'error'
                            ? 'bg-red-500'
                            : 'bg-emerald-500',
                      ].join(' ')}
                    />
                    {aiStatus}
                  </div>
                </div>

                {mode === 'play' && (
                  <div className="mt-1.5 flex flex-wrap items-center justify-center gap-0.5 border-t border-[var(--ui-border)] pt-1.5">
                    <button type="button" className={actionClass} onClick={navigateBack} disabled={!canGoBack || isEditMode}>↶ 悔棋</button>
                    <button type="button" className={actionClass} onClick={navigateForward} disabled={!canGoForward || isEditMode}>↷ 前进</button>
                    <button type="button" className={actionClass} onClick={passTurn} disabled={isEditMode}>○ 停一手</button>
                    <button type="button" className={isEditMode ? activeActionClass : actionClass} onClick={openSetup} aria-pressed={isEditMode}>◐ {isEditMode ? '结束摆棋' : '摆棋'}</button>
                    <button type="button" className={isInsertMode ? activeActionClass : actionClass} onClick={toggleStudy} aria-pressed={isInsertMode}>◇ {isInsertMode ? '结束研究' : '研究变化'}</button>
                    <button type="button" onClick={handleNewGame} className={newGameArmed ? 'min-h-9 rounded-lg bg-red-50 px-2.5 py-1.5 text-xs font-bold text-red-700' : actionClass}>＋ {newGameArmed ? '再点确认' : '新棋局'}</button>
                  </div>
                )}

                {mode === 'play' && isEditMode && (
                  <div className="mt-1.5 flex flex-wrap items-center justify-center gap-1 rounded-lg bg-[var(--ui-surface-2)] px-2 py-1.5">
                    <span className="mr-1 text-[10px] font-bold text-[var(--ui-text-muted)]">摆棋</span>
                    {SETUP_TOOLS.map(({ tool, label, icon }) => (
                      <button
                        key={tool}
                        type="button"
                        onClick={() => setEditTool(tool)}
                        aria-pressed={editTool === tool}
                        className={[
                          'min-h-8 rounded-md px-2 py-1 text-xs font-semibold transition-colors',
                          editTool === tool
                            ? 'bg-[var(--ui-text)] text-[var(--ui-bg)]'
                            : 'text-[var(--ui-text-muted)] hover:bg-[var(--ui-surface)] hover:text-[var(--ui-text)]',
                        ].join(' ')}
                      >
                        {icon} {label}
                      </button>
                    ))}
                    <button type="button" onClick={toggleEditMode} className="min-h-8 rounded-md px-2 py-1 text-xs font-bold text-[var(--ui-accent)] hover:bg-[var(--ui-surface)]">✓ 完成</button>
                  </div>
                )}

                {mode === 'play' && isInsertMode && (
                  <div className="mt-1.5 flex items-center justify-center gap-2 rounded-lg bg-[var(--ui-accent-soft)] px-2 py-1.5 text-[11px] text-[var(--ui-text-muted)]">
                    <span className="font-bold text-[var(--ui-text)]">◇ 研究变化中</span>
                    <span className="hidden sm:inline">直接继续落子，结束时点“结束研究”</span>
                  </div>
                )}

                {mode !== 'play' && (
                  <div className="mt-1.5 border-t border-[var(--ui-border)] pt-1.5">
                    <div className="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-xs">
                      {analysis && blackWinRate !== null ? (
                        <>
                          <span className="text-[var(--ui-text-muted)]">黑 <b className="tabular-nums text-[var(--ui-text)]">{blackWinRate.toFixed(1)}%</b></span>
                          <span className="h-3 w-px bg-[var(--ui-border)]" />
                          <span className="text-[var(--ui-text-muted)]">白 <b className="tabular-nums text-[var(--ui-text)]">{(100 - blackWinRate).toFixed(1)}%</b></span>
                          <span className="h-3 w-px bg-[var(--ui-border)]" />
                          <span className="text-[var(--ui-text-muted)]">目差 <b className="tabular-nums text-[var(--ui-text)]">{scoreText(analysis.rootScoreLead)}</b></span>
                        </>
                      ) : (
                        <span className="text-[var(--ui-text-muted)]">正在分析当前局面…</span>
                      )}

                      <button type="button" onClick={refreshCurrentMode} className="rounded-md px-2 py-0.5 text-[10px] font-bold text-[var(--ui-accent)] hover:bg-[var(--ui-accent-soft)]">↻ 重新分析</button>
                    </div>

                    {mode === 'position' && (
                      <div className="mt-1 text-center text-[10px] text-[var(--ui-text-faint)]">只显示局势判断，不提示下一手</div>
                    )}

                    {mode === 'guide' && (
                      <div className="mt-1.5 flex flex-wrap items-center justify-center gap-1">
                        <span className="mr-1 text-[10px] font-bold text-[var(--ui-text-faint)]">推荐</span>
                        {candidates.length > 0 ? (
                          candidates.map((move, index) => {
                            const selected = previewMove?.x === move.x && previewMove?.y === move.y;
                            return (
                              <button
                                key={`${move.x},${move.y}`}
                                type="button"
                                onClick={() => togglePreview(move)}
                                aria-pressed={selected}
                                className={[
                                  'min-h-8 rounded-full border px-2.5 py-1 text-xs font-bold transition-all touch-manipulation',
                                  selected
                                    ? 'border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] text-[var(--ui-text)]'
                                    : 'border-[var(--ui-border)] bg-[var(--ui-surface)] text-[var(--ui-text)] hover:border-[var(--ui-border-strong)]',
                                ].join(' ')}
                              >
                                <span className="mr-1 text-[var(--ui-text-muted)]">{index + 1}</span>
                                {moveLabel(move, boardSize)}
                                <span className="ml-1 text-[10px] font-medium text-[var(--ui-text-faint)]">{candidateLossText(move, index)}</span>
                              </button>
                            );
                          })
                        ) : (
                          <span className="text-[10px] text-[var(--ui-text-muted)]">正在计算推荐…</span>
                        )}
                        {previewMove && <span className="ml-1 text-[10px] font-semibold text-[var(--ui-accent)]">已显示20手变化</span>}
                      </div>
                    )}
                  </div>
                )}
              </section>
            );
          };

          PersonalModeDock.displayName = 'PersonalModeDock';
          EOF

          # -------------------------------------------------------
          # 3. 修改现有源码
          # -------------------------------------------------------
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("app")

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Patch anchor not found: {label}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("patched:", label)

          # ---------- 品牌 ----------
          index_path = root / "index.html"
          html = index_path.read_text(encoding="utf-8")
          html = html.replace('<html lang="en">', '<html lang="zh-Hans">')
          html = html.replace('<title>Web KaTrain</title>', '<title>围棋试下</title>')
          html = html.replace(
              'content="Web KaTrain is a browser-native Go study board with SGF editing, analysis, library storage, and offline-ready review tools."',
              'content="私人围棋棋盘：下棋、局势分析与 KataGo AI 指导。"'
          )
          index_path.write_text(html, encoding="utf-8")

          manifest_path = root / "public" / "manifest.webmanifest"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "围棋试下"
          manifest["short_name"] = "围棋"
          manifest["description"] = "私人围棋棋盘：下棋、局势分析与 KataGo AI 指导。"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          app_info = root / "src" / "utils" / "appInfo.ts"
          app_info_text = app_info.read_text(encoding="utf-8")
          app_info_text = app_info_text.replace("name: 'Web KaTrain'", "name: '围棋试下'", 1)
          app_info.write_text(app_info_text, encoding="utf-8")

          # ---------- 桌面顶部品牌改成中文 ----------
          dashboard_path = root / "src" / "components" / "dashboard" / "DesktopDashboard.tsx"
          dashboard_text = dashboard_path.read_text(encoding="utf-8")
          dashboard_text = dashboard_text.replace(
              '<h1 className="brand-name">Web <b>KaTrain</b></h1>',
              '<h1 className="brand-name">围棋<b>试下</b></h1>',
              1
          )
          dashboard_path.write_text(dashboard_text, encoding="utf-8")

          # ---------- 默认仍然关闭 AI ----------
          # 不把 isAnalysisMode 默认改为 true。
          # 只把旧版默认覆盖层关掉，让“下棋模式”保持干净。
          store_path = root / "src" / "store" / "gameStore.ts"
          store = store_path.read_text(encoding="utf-8")

          store = store.replace(
              "import { getPreferredAppLocaleId, isAppLocaleId } from '../utils/locales';",
              "import { isAppLocaleId } from '../utils/locales';",
              1
          )
          store = store.replace(
              "appLocale: getPreferredAppLocaleId(),",
              "appLocale: 'zh',",
              1
          )

          # 初始参数只是兜底，实际由三个模式动态切换。
          patches = [
              (r"export const DEFAULT_KATAGO_VISITS\s*=\s*\d+;", "export const DEFAULT_KATAGO_VISITS = 120;"),
              (r"katagoMaxTimeMs:\s*\d+,", "katagoMaxTimeMs: 2000,"),
              (r"katagoBatchSize:\s*\d+,", "katagoBatchSize: 4,"),
              (r"katagoTopK:\s*\d+,", "katagoTopK: 1,"),
              (r"katagoAnalysisPvLen:\s*\d+,", "katagoAnalysisPvLen: 0,"),
          ]
          for pattern, replacement in patches:
              store, count = re.subn(pattern, replacement, store, count=1)
              if count != 1:
                  raise RuntimeError(f"Expected one setting patch for {pattern}, got {count}")

          store = store.replace("analysisShowChildren: true,", "analysisShowChildren: false,", 1)
          store = store.replace("analysisShowEval: true,", "analysisShowEval: false,", 1)
          store = store.replace("analysisShowHints: true,", "analysisShowHints: false,", 1)
          store = store.replace("analysisShowOwnership: true,", "analysisShowOwnership: false,", 1)
          store_path.write_text(store, encoding="utf-8")

          # ---------- 手机旧顶部栏默认关闭 ----------
          mobile_layout_path = root / "src" / "components" / "Layout.tsx"
          mobile_layout_text = mobile_layout_path.read_text(encoding="utf-8")
          topbar_pattern = re.compile(
              r"  const \[topBarOpen, setTopBarOpen\] = useState\(\(\) => \{\n"
              r"    return readLocalStorage\('web-katrain:top_bar_open:v1'\) !== 'false';\n"
              r"  \}\);"
          )
          mobile_layout_text, topbar_count = topbar_pattern.subn(
              "  const [topBarOpen, setTopBarOpen] = useState(false);",
              mobile_layout_text,
              count=1
          )
          if topbar_count != 1:
              print("mobile top bar patch skipped")
          mobile_layout_path.write_text(mobile_layout_text, encoding="utf-8")

          # ---------- 棋盘上 AI 推荐最多只显示前三 ----------
          hints_path = root / "src" / "utils" / "analysisHints.ts"
          hints = hints_path.read_text(encoding="utf-8")
          hints = hints.replace(
              "export const ANALYSIS_HINT_LIMIT = 10;",
              "export const ANALYSIS_HINT_LIMIT = 3;",
              1
          )
          hints = hints.replace(
              "export const COMPACT_ANALYSIS_HINT_LIMIT = 5;",
              "export const COMPACT_ANALYSIS_HINT_LIMIT = 3;",
              1
          )
          hints_path.write_text(hints, encoding="utf-8")

          # ---------- Layout 接入私人模式 ----------
          layout_path = root / "src" / "components" / "Layout.tsx"

          replace_once(
              layout_path,
              "import { CandidatePvTiles } from './CandidatePvTiles';",
              "import { PersonalModeDock } from './PersonalModeDock';\n"
              "import { usePersonalModeStore } from '../store/personalModeStore';",
              "Layout imports"
          )

          replace_once(
              layout_path,
              "  const [reportHoverMove, setReportHoverMove] = useState<CandidateMove | null>(null);",
              "  const [reportHoverMove, setReportHoverMove] = useState<CandidateMove | null>(null);\n"
              "  const personalPreviewMove = usePersonalModeStore((state) => state.previewMove);",
              "personal preview selector"
          )

          replace_once(
              layout_path,
              "  const activeHoverMove = reportHoverMove ?? hoveredMove;",
              "  const activeHoverMove = personalPreviewMove ?? reportHoverMove ?? hoveredMove;",
              "personal PV overlay"
          )

          # 两个棋盘实例都允许私人 PV 强制显示。
          layout_text = layout_path.read_text(encoding="utf-8")
          force_count = layout_text.count("forcePvOverlay={!!reportHoverMove}")
          if force_count < 1:
              raise RuntimeError("No forcePvOverlay anchor found")
          layout_text = layout_text.replace(
              "forcePvOverlay={!!reportHoverMove}",
              "forcePvOverlay={!!reportHoverMove || !!personalPreviewMove}"
          )

          # 原版 CandidatePvTiles 在手机上会重复显示，我们自己的中文推荐卡片已替代它。
          # 直接删除整段 JSX，避免 TypeScript 继续检查 false && 后面的不可达代码。
          candidate_pattern = re.compile(
              r"\n\s*\{isMobile && showBoardAnalysisCommandBar && isAnalysisMode && !isEditMode && !scoringMode && \(\n"
              r"\s*<CandidatePvTiles\n"
              r"\s*pinnedKey=\{reportHoverMove \? `\$\{reportHoverMove\.x\},\$\{reportHoverMove\.y\}` : null\}\n"
              r"\s*onPin=\{setReportHoverMove\}\n"
              r"\s*/>\n"
              r"\s*\)\}"
          )
          layout_text, removed_count = candidate_pattern.subn(
              "\n            {/* 私人三模式版：候选变化由 PersonalModeDock 控制 */}",
              layout_text,
              count=1
          )
          if removed_count != 1:
              raise RuntimeError(f"Expected to remove one CandidatePvTiles block, got {removed_count}")

          # 三模式中文控制层对电脑和手机都显示。
          desktop_anchor = "      {isDesktop && (\n"
          if desktop_anchor not in layout_text:
              raise RuntimeError("Desktop render anchor not found")
          layout_text = layout_text.replace(
              desktop_anchor,
              "      <PersonalModeDock />\n\n" + desktop_anchor,
              1
          )

          layout_path.write_text(layout_text, encoding="utf-8")

          # ---------- v5 极简界面 ----------
          index_css_path = root / "src" / "index.css"
          private_css = r'''
          html,
          body,
          #root {
            background: color-mix(in srgb, #f7f4ed 72%, var(--ui-bg)) !important;
          }

          .wk-dashboard {
            --header-h: 0px !important;
            --sidebar-w: 0px !important;
            --library-w: 0px !important;
            --commandbar-reserve: 0px !important;
            --stage-pad: 8px !important;
            grid-template-rows: minmax(0, 1fr) !important;
            background: transparent !important;
          }

          .wk-dashboard .header,
          .wk-dashboard .library,
          .wk-dashboard .sidebar,
          .wk-dashboard .edge-toggle,
          .wk-dashboard .hero-card,
          .wk-dashboard .gamestrip,
          .wk-dashboard .commandbar,
          .wk-dashboard .navbar {
            display: none !important;
          }

          .wk-dashboard .body {
            grid-row: 1 !important;
            grid-template-columns: minmax(0, 1fr) !important;
          }

          .wk-dashboard .board-col {
            grid-column: 1 / -1 !important;
            background: transparent !important;
          }

          .wk-dashboard .board-stage {
            padding: 8px 14px 12px !important;
            background: transparent !important;
          }

          [data-edit-toolbar],
          .mobile-bottom-controls,
          .mobile-tabbar {
            display: none !important;
          }

          :root {
            --mobile-bottom-controls-height: 0px !important;
            --mobile-tabbar-height: 0px !important;
          }

          .personal-mode-dock {
            flex: none;
          }

          .personal-mode-dock button {
            -webkit-tap-highlight-color: transparent;
          }

          .personal-mode-dock button:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--ui-accent) 58%, transparent);
            outline-offset: 2px;
          }

          @media (min-width: 900px) {
            .wk-dashboard .board-stage {
              padding-inline: clamp(18px, 4vw, 64px) !important;
            }
          }

          @media (max-width: 639px) {
            .personal-mode-dock {
              width: calc(100vw - 12px) !important;
              margin-top: 6px !important;
              margin-bottom: 5px !important;
              border-radius: 11px !important;
              padding: 6px !important;
              box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06) !important;
            }

            .mobile-board-shell {
              padding-top: 4px !important;
            }

            .mobile-board-canvas {
              padding-top: 2px !important;
              padding-bottom: 2px !important;
            }
          }
          '''
          with index_css_path.open("a", encoding="utf-8") as css_file:
              css_file.write("\n" + private_css + "\n")

          # ---------- 保留开源许可 ----------
          license_text = (root / "LICENSE").read_text(encoding="utf-8")
          (root / "public" / "WEB_KATRAIN_LICENSE.txt").write_text(
              license_text,
              encoding="utf-8"
          )

          (root / "public" / "GO_BOARD_BUILD.txt").write_text(
              "围棋试下 v5 极简三模式版\n"
              "默认：下棋模式，AI关闭\n"
              "下棋工具：悔棋/前进/停一手/摆棋/研究变化/新棋局\n"
              "局势分析：120 visits / 最长2秒 / 胜率+目差\n"
              "AI指导：250 visits / 最长4秒 / Top3 / PV最多20手\n"
              "AI：浏览器本地 KataGo 风格引擎，WebGPU 优先\n",
              encoding="utf-8"
          )

          print("Private three-mode customization complete.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Go Board
        working-directory: app
        env:
          VITE_BASE_URL: /go-board/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
