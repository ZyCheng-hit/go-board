name: Deploy Go Board AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: go-board-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. 下载 Web KaTrain
      # =========================================================
      - name: Checkout browser KataGo app
        uses: actions/checkout@v6
        with:
          repository: Sir-Teo/web-katrain
          ref: 35a5113f9b3ade5ce2116884f3a2d00e02c7c77b
          path: app
          lfs: true


      # =========================================================
      # 2. 修改成我们的私人围棋 AI
      # =========================================================
      - name: Customize Go Board AI
        shell: bash
        run: |
          python - <<'PY'

          from pathlib import Path
          import json
          import re

          root = Path("app")


          # =====================================================
          # A. 修改网页名称
          # =====================================================

          index_path = root / "index.html"

          html = index_path.read_text(
              encoding="utf-8"
          )

          html = html.replace(
              '<html lang="en">',
              '<html lang="zh-Hans">'
          )

          html = html.replace(
              '<title>Web KaTrain</title>',
              '<title>围棋试下</title>'
          )

          html = html.replace(
              'content="Web KaTrain"',
              'content="围棋试下"'
          )

          html = html.replace(
              'content="Web KaTrain is a browser-native Go study board with SGF editing, analysis, library storage, and offline-ready review tools."',
              'content="围棋摆棋、试下与 KataGo AI 分析。"'
          )

          index_path.write_text(
              html,
              encoding="utf-8"
          )


          # =====================================================
          # B. 修改 PWA 名称
          # =====================================================

          manifest_path = (
              root /
              "public" /
              "manifest.webmanifest"
          )

          manifest = json.loads(
              manifest_path.read_text(
                  encoding="utf-8"
              )
          )

          manifest["name"] = "围棋试下"

          manifest["short_name"] = "围棋"

          manifest["description"] = (
              "围棋摆棋、悔棋、试下与 KataGo AI 分析。"
          )

          manifest_path.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # =====================================================
          # C. AI 默认参数
          # =====================================================

          store_path = (
              root /
              "src" /
              "store" /
              "gameStore.ts"
          )

          store = store_path.read_text(
              encoding="utf-8"
          )


          # -----------------------------------------------------
          # 手机优先：
          #
          # 250 visits
          # 最长 4 秒
          # WebGPU
          # 只返回前三候选
          # -----------------------------------------------------

          replacements = [

              (
                  r"export const DEFAULT_KATAGO_VISITS\s*=\s*\d+;",
                  "export const DEFAULT_KATAGO_VISITS = 250;"
              ),

              (
                  r"katagoMaxTimeMs:\s*\d+,",
                  "katagoMaxTimeMs: 4000,"
              ),

              (
                  r"katagoBatchSize:\s*\d+,",
                  "katagoBatchSize: 8,"
              ),

              (
                  r"katagoTopK:\s*\d+,",
                  "katagoTopK: 3,"
              ),

              # ===============================================
              # PV 深度
              # ===============================================

              (
                  r"katagoAnalysisPvLen:\s*\d+,",
                  "katagoAnalysisPvLen: 20,"
              ),

          ]


          for pattern, replacement in replacements:

              store, count = re.subn(
                  pattern,
                  replacement,
                  store,
                  count=1
              )

              if count:
                  print(
                      "Patched:",
                      pattern
                  )

              else:
                  print(
                      "Not found:",
                      pattern
                  )


          # =====================================================
          # D. 默认简体中文
          # =====================================================

          store = store.replace(

              "appLocale: getPreferredAppLocaleId(),",

              "appLocale: 'zh',",

              1

          )


          # 删除已经不用的 import
          store = store.replace(

              "import { getPreferredAppLocaleId, isAppLocaleId } from '../utils/locales';",

              "import { isAppLocaleId } from '../utils/locales';",

              1

          )


          # =====================================================
          # E. 默认打开 AI 分析模式
          #
          # 这样每下一手以后自动重新分析。
          # =====================================================

          store = store.replace(

              "isAnalysisMode: false,",

              "isAnalysisMode: true,",

              1

          )


          # =====================================================
          # F. 默认显示推荐着
          # =====================================================

          store = store.replace(

              "analysisShowHints: true,",

              "analysisShowHints: true,",

              1

          )


          # 默认关闭 territory 热力图
          # 防止棋盘太乱

          store = store.replace(

              "analysisShowOwnership: true,",

              "analysisShowOwnership: false,",

              1

          )


          store_path.write_text(
              store,
              encoding="utf-8"
          )


          # =====================================================
          # G. 棋盘只显示 AI 前三推荐
          # =====================================================

          hints_path = (
              root /
              "src" /
              "utils" /
              "analysisHints.ts"
          )

          hints = hints_path.read_text(
              encoding="utf-8"
          )

          hints = hints.replace(

              "export const ANALYSIS_HINT_LIMIT = 10;",

              "export const ANALYSIS_HINT_LIMIT = 3;"

          )

          hints = hints.replace(

              "export const COMPACT_ANALYSIS_HINT_LIMIT = 5;",

              "export const COMPACT_ANALYSIS_HINT_LIMIT = 3;"

          )

          hints_path.write_text(
              hints,
              encoding="utf-8"
          )


          # =====================================================
          # H. 修改候选着按钮
          #
          # 只显示前三个：
          #
          # 1. R17
          # 2. Q10
          # 3. C6
          #
          # 点击以后显示 PV
          # =====================================================

          candidate_path = (
              root /
              "src" /
              "components" /
              "CandidatePvTiles.tsx"
          )

          candidate = candidate_path.read_text(
              encoding="utf-8"
          )


          # 原来显示最多 12 个候选
          # 改成只显示前三

          candidate = candidate.replace(

              ".slice(0, 12),",

              ".slice(0, 3),"

          )


          # map 增加 index
          # 用于显示 1 / 2 / 3

          candidate = candidate.replace(

              "{tiles.map((move) => {",

              "{tiles.map((move, index) => {"

          )


          # -----------------------------------------------------
          # 点击候选着的时候：
          #
          # 最多只显示 20 手变化
          # -----------------------------------------------------

          candidate = candidate.replace(

              "onClick={() => onPin(active ? null : move)}",

              """onClick={() =>
                onPin(
                  active
                    ? null
                    : {
                        ...move,
                        pv: move.pv?.slice(0, 20),
                      }
                )
              }"""

          )


          # -----------------------------------------------------
          # 按钮文字
          #
          # R17
          #
          # 改成：
          #
          # 1. R17
          # -----------------------------------------------------

          candidate = candidate.replace(

              "<span>{moveLabel(move, boardSize)}</span>",

              """<span className="font-semibold">
                {index + 1}. {moveLabel(move, boardSize)}
              </span>
              <span className="opacity-60">
                20手变化
              </span>"""

          )


          candidate_path.write_text(
              candidate,
              encoding="utf-8"
          )


          # =====================================================
          # I. 让候选着按钮同时在电脑和手机显示
          #
          # 原版只在手机显示 CandidatePvTiles。
          # =====================================================

          layout_path = (
              root /
              "src" /
              "components" /
              "Layout.tsx"
          )

          layout = layout_path.read_text(
              encoding="utf-8"
          )

          layout = layout.replace(

              "isMobile && showBoardAnalysisCommandBar && isAnalysisMode && !isEditMode && !scoringMode",

              "showBoardAnalysisCommandBar && isAnalysisMode && !isEditMode && !scoringMode"

          )

          layout_path.write_text(
              layout,
              encoding="utf-8"
          )


          # =====================================================
          # J. 保留 Web KaTrain MIT License
          # =====================================================

          license_text = (
              root /
              "LICENSE"
          ).read_text(
              encoding="utf-8"
          )

          (
              root /
              "public" /
              "WEB_KATRAIN_LICENSE.txt"
          ).write_text(
              license_text,
              encoding="utf-8"
          )


          # =====================================================
          # K. 写版本信息
          # =====================================================

          (
              root /
              "public" /
              "GO_BOARD_BUILD.txt"
          ).write_text(

              "围棋试下私人 AI 版\n"
              "AI：KataGo browser engine\n"
              "候选着：Top 3\n"
              "PV：20 手\n"
              "默认分析：250 visits\n"
              "最长分析时间：4 秒\n"
              "Backend：WebGPU preferred\n",

              encoding="utf-8"

          )


          print(
              "Go Board AI customization complete."
          )

          PY


      # =========================================================
      # 3. Node
      # =========================================================

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json


      # =========================================================
      # 4. 安装依赖
      # =========================================================

      - name: Install dependencies
        working-directory: app
        run: npm ci


      # =========================================================
      # 5. Build
      # =========================================================

      - name: Build Go Board AI
        working-directory: app
        env:
          VITE_BASE_URL: /go-board/
        run: npm run build


      # =========================================================
      # 6. GitHub Pages
      # =========================================================

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # =========================================================
      # 7. 上传网页
      # =========================================================

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist



  # ===========================================================
  # 8. 部署
  # ===========================================================

  deploy:

    needs: build

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v5
