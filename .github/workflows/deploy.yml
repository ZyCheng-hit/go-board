name: Deploy Go Board AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: go-board-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout browser KataGo app
        uses: actions/checkout@v6
        with:
          repository: Sir-Teo/web-katrain
          ref: 35a5113f9b3ade5ce2116884f3a2d00e02c7c77b
          path: app
          lfs: true

      - name: Build private Chinese three-mode UI
        shell: bash
        run: |
          set -euo pipefail

          # -------------------------------------------------------
          # 1. 私人模式状态
          # -------------------------------------------------------
          cat > app/src/store/personalModeStore.ts <<'EOF'
          import { create } from 'zustand';
          import type { CandidateMove } from '../types';

          export type PersonalMode = 'play' | 'position' | 'guide';

          type PersonalModeState = {
            mode: PersonalMode;
            previewMove: CandidateMove | null;
            setMode: (mode: PersonalMode) => void;
            setPreviewMove: (move: CandidateMove | null) => void;
          };

          export const usePersonalModeStore = create<PersonalModeState>((set) => ({
            mode: 'play',
            previewMove: null,
            setMode: (mode) => set({ mode, previewMove: null }),
            setPreviewMove: (previewMove) => set({ previewMove }),
          }));
          EOF

          # -------------------------------------------------------
          # 2. 中文三模式控制条
          # -------------------------------------------------------
          cat > app/src/components/PersonalModeDock.tsx <<'EOF'
          import React, { useEffect, useMemo, useState } from 'react';
          import { useGameStore } from '../store/gameStore';
          import {
            usePersonalModeStore,
            type PersonalMode,
          } from '../store/personalModeStore';
          import type { CandidateMove, EditTool } from '../types';

          function moveLabel(move: CandidateMove, boardSize: number): string {
            if (move.x < 0 || move.y < 0) return '虚手';
            const column = String.fromCharCode(65 + (move.x >= 8 ? move.x + 1 : move.x));
            return `${column}${boardSize - move.y}`;
          }

          function scoreText(scoreLead: number): string {
            if (!Number.isFinite(scoreLead) || Math.abs(scoreLead) < 0.05) return '接近持平';
            const side = scoreLead > 0 ? '黑' : '白';
            return `${side} +${Math.abs(scoreLead).toFixed(1)}目`;
          }

          function candidateLossText(move: CandidateMove, index: number): string {
            if (index === 0) return '最佳';
            const loss = Math.max(0, move.relativePointsLost ?? move.pointsLost ?? 0);
            return `损失约 ${loss.toFixed(1)}目`;
          }

          const MODE_INFO: Record<PersonalMode, { title: string; subtitle: string; icon: string }> = {
            play: {
              title: '下棋模式',
              subtitle: '关闭 AI，专心下棋',
              icon: '●',
            },
            position: {
              title: '局势分析',
              subtitle: '只看当前胜率和目差',
              icon: '◐',
            },
            guide: {
              title: 'AI指导',
              subtitle: '前三推荐与20手变化',
              icon: '✦',
            },
          };

          const SETUP_TOOLS: Array<{ tool: EditTool; label: string; icon: string }> = [
            { tool: 'setup-black', label: '黑子', icon: '●' },
            { tool: 'setup-white', label: '白子', icon: '○' },
            { tool: 'setup-alternate', label: '交替', icon: '◐' },
            { tool: 'setup-erase', label: '擦除', icon: '⌫' },
          ];

          export const PersonalModeDock: React.FC = () => {
            const currentNode = useGameStore((state) => state.currentNode);
            const isAnalysisMode = useGameStore((state) => state.isAnalysisMode);
            const toggleAnalysisMode = useGameStore((state) => state.toggleAnalysisMode);
            const runAnalysis = useGameStore((state) => state.runAnalysis);
            const updateSettings = useGameStore((state) => state.updateSettings);
            const engineStatus = useGameStore((state) => state.engineStatus);

            const navigateBack = useGameStore((state) => state.navigateBack);
            const navigateForward = useGameStore((state) => state.navigateForward);
            const passTurn = useGameStore((state) => state.passTurn);
            const resetGame = useGameStore((state) => state.resetGame);

            const isEditMode = useGameStore((state) => state.isEditMode);
            const toggleEditMode = useGameStore((state) => state.toggleEditMode);
            const editTool = useGameStore((state) => state.editTool);
            const setEditTool = useGameStore((state) => state.setEditTool);

            const isInsertMode = useGameStore((state) => state.isInsertMode);
            const toggleInsertMode = useGameStore((state) => state.toggleInsertMode);

            const mode = usePersonalModeStore((state) => state.mode);
            const previewMove = usePersonalModeStore((state) => state.previewMove);
            const setMode = usePersonalModeStore((state) => state.setMode);
            const setPreviewMove = usePersonalModeStore((state) => state.setPreviewMove);

            const [newGameArmed, setNewGameArmed] = useState(false);

            const analysis = currentNode.analysis ?? null;
            const boardSize = currentNode.gameState.board.length;
            const canGoBack = Boolean(currentNode.parent);
            const canGoForward = currentNode.children.length > 0;

            const candidates = useMemo(
              () =>
                [...(analysis?.moves ?? [])]
                  .filter((move) => move.x >= 0 && move.y >= 0)
                  .sort((a, b) => a.order - b.order || b.visits - a.visits)
                  .slice(0, 3),
              [analysis]
            );

            useEffect(() => {
              setPreviewMove(null);
            }, [currentNode.id, setPreviewMove]);

            useEffect(() => {
              if (!newGameArmed) return;
              const timer = window.setTimeout(() => setNewGameArmed(false), 2800);
              return () => window.clearTimeout(timer);
            }, [newGameArmed]);

            const stopBoardTools = () => {
              if (isEditMode) toggleEditMode();
              if (isInsertMode) toggleInsertMode();
            };

            const runForMode = (nextMode: Exclude<PersonalMode, 'play'>) => {
              const guide = nextMode === 'guide';

              stopBoardTools();

              updateSettings({
                analysisShowChildren: false,
                analysisShowEval: false,
                analysisShowHints: guide,
                analysisShowPolicy: false,
                analysisShowOwnership: false,
                showAnalysisBar: false,

                katagoVisits: guide ? 250 : 120,
                katagoMaxTimeMs: guide ? 4000 : 2000,
                katagoBatchSize: guide ? 8 : 4,
                katagoTopK: guide ? 3 : 1,
                katagoAnalysisPvLen: guide ? 20 : 0,
              });

              if (!isAnalysisMode) {
                toggleAnalysisMode();
              } else {
                void runAnalysis({
                  force: true,
                  visits: guide ? 250 : 120,
                  maxTimeMs: guide ? 4000 : 2000,
                  batchSize: guide ? 8 : 4,
                  topK: guide ? 3 : 1,
                  analysisPvLen: guide ? 20 : 0,
                });
              }
            };

            const chooseMode = (nextMode: PersonalMode) => {
              setPreviewMove(null);
              setMode(nextMode);

              if (nextMode === 'play') {
                updateSettings({
                  analysisShowChildren: false,
                  analysisShowEval: false,
                  analysisShowHints: false,
                  analysisShowPolicy: false,
                  analysisShowOwnership: false,
                  showAnalysisBar: false,
                });
                if (isAnalysisMode) toggleAnalysisMode();
                return;
              }

              runForMode(nextMode);
            };

            const openSetup = () => {
              if (isInsertMode) toggleInsertMode();
              if (!isEditMode) {
                setEditTool('setup-alternate');
                toggleEditMode();
              } else {
                toggleEditMode();
              }
            };

            const toggleStudy = () => {
              if (isEditMode) toggleEditMode();
              toggleInsertMode();
            };

            const handleNewGame = () => {
              if (!newGameArmed) {
                setNewGameArmed(true);
                return;
              }

              if (isAnalysisMode) toggleAnalysisMode();
              if (isEditMode) toggleEditMode();
              if (isInsertMode) toggleInsertMode();
              setPreviewMove(null);
              setMode('play');
              resetGame();
              setNewGameArmed(false);
            };

            const togglePreview = (move: CandidateMove) => {
              const alreadySelected =
                previewMove?.x === move.x && previewMove?.y === move.y;

              if (alreadySelected) {
                setPreviewMove(null);
                return;
              }

              setPreviewMove({
                ...move,
                pv: move.pv?.slice(0, 20),
              });
            };

            const blackWinRate =
              analysis && Number.isFinite(analysis.rootWinRate)
                ? Math.max(0, Math.min(100, analysis.rootWinRate * 100))
                : null;

            const modeButtonClass = (target: PersonalMode) => {
              const active = mode === target;
              return [
                'group relative min-h-[58px] overflow-hidden rounded-xl border px-3 py-2 text-left transition-all duration-150 touch-manipulation',
                active
                  ? 'border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] shadow-sm'
                  : 'border-[var(--ui-border)] bg-[var(--ui-surface)] hover:border-[var(--ui-border-strong)] hover:bg-[var(--ui-surface-2)]',
              ].join(' ');
            };

            const actionClass =
              'min-h-11 rounded-xl border border-[var(--ui-border)] bg-[var(--ui-surface)] px-3 py-2 text-sm font-semibold text-[var(--ui-text)] transition-all hover:border-[var(--ui-border-strong)] hover:bg-[var(--ui-surface-2)] disabled:cursor-not-allowed disabled:opacity-35 touch-manipulation';

            const activeActionClass =
              'min-h-11 rounded-xl border border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] px-3 py-2 text-sm font-semibold text-[var(--ui-text)] transition-all touch-manipulation';

            return (
              <section
                className="personal-mode-dock relative z-[75] mx-auto mb-3 mt-2 w-[min(96vw,920px)] rounded-2xl border border-[var(--ui-border)] bg-[var(--ui-panel)]/95 p-2.5 shadow-[0_10px_36px_rgba(15,23,42,0.10)] backdrop-blur-xl"
                aria-label="私人围棋控制台"
              >
                <div className="mb-2 flex items-center justify-between gap-3 px-1">
                  <div>
                    <div className="text-[11px] font-semibold uppercase tracking-[0.16em] text-[var(--ui-text-faint)]">
                      私人围棋
                    </div>
                    <div className="text-sm font-semibold text-[var(--ui-text)]">
                      {MODE_INFO[mode].title}
                    </div>
                  </div>

                  <div
                    className={[
                      'rounded-full border px-2.5 py-1 text-xs font-semibold',
                      mode === 'play'
                        ? 'border-[var(--ui-border)] bg-[var(--ui-surface)] text-[var(--ui-text-muted)]'
                        : engineStatus === 'error'
                          ? 'border-red-300 bg-red-50 text-red-700'
                          : 'border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] text-[var(--ui-text)]',
                    ].join(' ')}
                  >
                    {mode === 'play'
                      ? 'AI 关闭'
                      : engineStatus === 'error'
                        ? 'AI 加载失败'
                        : engineStatus === 'loading'
                          ? 'AI 加载中…'
                          : 'KataGo 就绪'}
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-1.5">
                  {(['play', 'position', 'guide'] as PersonalMode[]).map((target) => {
                    const info = MODE_INFO[target];
                    const active = mode === target;

                    return (
                      <button
                        key={target}
                        type="button"
                        className={modeButtonClass(target)}
                        onClick={() => chooseMode(target)}
                        aria-pressed={active}
                      >
                        <div className="flex items-center gap-2">
                          <span
                            className={[
                              'flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-sm font-bold',
                              active
                                ? 'bg-[var(--ui-accent)] text-white'
                                : 'bg-[var(--ui-surface-2)] text-[var(--ui-text-muted)]',
                            ].join(' ')}
                            aria-hidden="true"
                          >
                            {info.icon}
                          </span>
                          <span className="min-w-0">
                            <span className="block truncate text-sm font-bold text-[var(--ui-text)]">
                              {info.title}
                            </span>
                            <span className="hidden truncate text-[10px] text-[var(--ui-text-muted)] sm:block">
                              {info.subtitle}
                            </span>
                          </span>
                        </div>
                      </button>
                    );
                  })}
                </div>

                {mode === 'play' && (
                  <div className="mt-2.5 border-t border-[var(--ui-border)] pt-2.5">
                    <div className="mb-1.5 flex items-center justify-between px-0.5">
                      <span className="text-xs font-semibold text-[var(--ui-text-muted)]">
                        对局工具
                      </span>
                      <span className="text-[11px] text-[var(--ui-text-faint)]">
                        {isInsertMode
                          ? '研究变化中'
                          : isEditMode
                            ? '摆棋模式'
                            : `第 ${currentNode.gameState.moveHistory.length} 手`}
                      </span>
                    </div>

                    <div className="grid grid-cols-3 gap-1.5 sm:grid-cols-6">
                      <button
                        type="button"
                        className={actionClass}
                        onClick={navigateBack}
                        disabled={!canGoBack || isEditMode}
                        title="退回上一手"
                      >
                        <span className="mr-1" aria-hidden="true">↶</span>
                        悔棋
                      </button>

                      <button
                        type="button"
                        className={actionClass}
                        onClick={navigateForward}
                        disabled={!canGoForward || isEditMode}
                        title="恢复下一手"
                      >
                        <span className="mr-1" aria-hidden="true">↷</span>
                        前进
                      </button>

                      <button
                        type="button"
                        className={actionClass}
                        onClick={passTurn}
                        disabled={isEditMode}
                        title="虚手 / 停一手"
                      >
                        <span className="mr-1" aria-hidden="true">○</span>
                        停一手
                      </button>

                      <button
                        type="button"
                        className={isEditMode ? activeActionClass : actionClass}
                        onClick={openSetup}
                        aria-pressed={isEditMode}
                        title="自由摆放黑白棋子"
                      >
                        <span className="mr-1" aria-hidden="true">◐</span>
                        {isEditMode ? '结束摆棋' : '摆棋'}
                      </button>

                      <button
                        type="button"
                        className={isInsertMode ? activeActionClass : actionClass}
                        onClick={toggleStudy}
                        aria-pressed={isInsertMode}
                        title="从当前局面研究一条变化"
                      >
                        <span className="mr-1" aria-hidden="true">◇</span>
                        {isInsertMode ? '结束研究' : '研究变化'}
                      </button>

                      <button
                        type="button"
                        className={
                          newGameArmed
                            ? 'min-h-11 rounded-xl border border-red-400 bg-red-50 px-3 py-2 text-sm font-bold text-red-700 transition-all touch-manipulation'
                            : actionClass
                        }
                        onClick={handleNewGame}
                        title="开始一盘新棋"
                      >
                        <span className="mr-1" aria-hidden="true">＋</span>
                        {newGameArmed ? '再点确认' : '新棋局'}
                      </button>
                    </div>

                    {isEditMode && (
                      <div className="mt-2 rounded-xl border border-[var(--ui-border)] bg-[var(--ui-surface-2)] p-2">
                        <div className="mb-1.5 flex items-center justify-between">
                          <span className="text-xs font-semibold text-[var(--ui-text)]">
                            摆棋工具
                          </span>
                          <span className="text-[11px] text-[var(--ui-text-muted)]">
                            点击棋盘交叉点直接摆放
                          </span>
                        </div>

                        <div className="grid grid-cols-5 gap-1.5">
                          {SETUP_TOOLS.map(({ tool, label, icon }) => (
                            <button
                              key={tool}
                              type="button"
                              onClick={() => setEditTool(tool)}
                              aria-pressed={editTool === tool}
                              className={[
                                'min-h-10 rounded-lg border px-2 py-1.5 text-xs font-semibold transition-all',
                                editTool === tool
                                  ? 'border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] text-[var(--ui-text)]'
                                  : 'border-[var(--ui-border)] bg-[var(--ui-surface)] text-[var(--ui-text-muted)] hover:bg-[var(--ui-surface-2)]',
                              ].join(' ')}
                            >
                              <span className="mr-1" aria-hidden="true">{icon}</span>
                              {label}
                            </button>
                          ))}

                          <button
                            type="button"
                            onClick={toggleEditMode}
                            className="min-h-10 rounded-lg border border-[var(--ui-border)] bg-[var(--ui-surface)] px-2 py-1.5 text-xs font-bold text-[var(--ui-text)] hover:bg-[var(--ui-surface-2)]"
                          >
                            ✓ 完成
                          </button>
                        </div>
                      </div>
                    )}

                    {isInsertMode && (
                      <div className="mt-2 flex items-start gap-2 rounded-xl border border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] px-3 py-2">
                        <span className="mt-0.5 text-[var(--ui-accent)]" aria-hidden="true">◇</span>
                        <div className="min-w-0">
                          <div className="text-xs font-bold text-[var(--ui-text)]">
                            正在研究变化
                          </div>
                          <div className="text-[11px] leading-5 text-[var(--ui-text-muted)]">
                            继续在棋盘落子即可试下变化；完成后点“结束研究”回到正常对局工具。
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {mode !== 'play' && (
                  <div className="mt-2.5 border-t border-[var(--ui-border)] pt-2.5">
                    {analysis && blackWinRate !== null ? (
                      <div className="grid grid-cols-3 gap-1.5">
                        <div className="rounded-xl border border-[var(--ui-border)] bg-[var(--ui-surface)] px-3 py-2">
                          <div className="text-[10px] font-semibold uppercase tracking-wider text-[var(--ui-text-faint)]">
                            黑胜率
                          </div>
                          <div className="mt-0.5 text-lg font-bold tabular-nums text-[var(--ui-text)]">
                            {blackWinRate.toFixed(1)}%
                          </div>
                        </div>

                        <div className="rounded-xl border border-[var(--ui-border)] bg-[var(--ui-surface)] px-3 py-2">
                          <div className="text-[10px] font-semibold uppercase tracking-wider text-[var(--ui-text-faint)]">
                            白胜率
                          </div>
                          <div className="mt-0.5 text-lg font-bold tabular-nums text-[var(--ui-text)]">
                            {(100 - blackWinRate).toFixed(1)}%
                          </div>
                        </div>

                        <div className="rounded-xl border border-[var(--ui-border)] bg-[var(--ui-surface)] px-3 py-2">
                          <div className="text-[10px] font-semibold uppercase tracking-wider text-[var(--ui-text-faint)]">
                            当前目差
                          </div>
                          <div className="mt-0.5 text-lg font-bold tabular-nums text-[var(--ui-text)]">
                            {scoreText(analysis.rootScoreLead)}
                          </div>
                        </div>
                      </div>
                    ) : (
                      <div className="rounded-xl border border-dashed border-[var(--ui-border)] bg-[var(--ui-surface)] px-3 py-3 text-center text-sm text-[var(--ui-text-muted)]">
                        正在分析当前局面…
                      </div>
                    )}

                    {mode === 'position' && (
                      <p className="mt-2 text-center text-xs text-[var(--ui-text-muted)]">
                        局势分析不会显示推荐着，避免干扰你的判断。
                      </p>
                    )}

                    {mode === 'guide' && (
                      <div className="mt-2.5">
                        <div className="mb-1.5 flex items-center justify-between px-0.5">
                          <span className="text-xs font-bold text-[var(--ui-text)]">
                            AI 前三推荐
                          </span>
                          <span className="text-[11px] text-[var(--ui-text-muted)]">
                            点击查看最多20手变化
                          </span>
                        </div>

                        <div className="grid grid-cols-1 gap-1.5 sm:grid-cols-3">
                          {candidates.length > 0 ? (
                            candidates.map((move, index) => {
                              const selected =
                                previewMove?.x === move.x && previewMove?.y === move.y;

                              return (
                                <button
                                  key={`${move.x},${move.y}`}
                                  type="button"
                                  onClick={() => togglePreview(move)}
                                  aria-pressed={selected}
                                  className={[
                                    'relative min-h-[62px] overflow-hidden rounded-xl border px-3 py-2 text-left transition-all touch-manipulation',
                                    selected
                                      ? 'border-[var(--ui-accent)] bg-[var(--ui-accent-soft)] shadow-sm'
                                      : 'border-[var(--ui-border)] bg-[var(--ui-surface)] hover:border-[var(--ui-border-strong)] hover:bg-[var(--ui-surface-2)]',
                                  ].join(' ')}
                                >
                                  <div className="flex items-start justify-between gap-2">
                                    <div className="flex items-center gap-2">
                                      <span
                                        className={[
                                          'flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-black',
                                          index === 0
                                            ? 'bg-[var(--ui-accent)] text-white'
                                            : 'bg-[var(--ui-surface-2)] text-[var(--ui-text)]',
                                        ].join(' ')}
                                      >
                                        {index + 1}
                                      </span>

                                      <div>
                                        <div className="text-base font-black text-[var(--ui-text)]">
                                          {moveLabel(move, boardSize)}
                                        </div>
                                        <div className="text-[10px] text-[var(--ui-text-muted)]">
                                          {candidateLossText(move, index)}
                                        </div>
                                      </div>
                                    </div>

                                    <span className="rounded-full bg-[var(--ui-surface-2)] px-2 py-0.5 text-[10px] font-semibold text-[var(--ui-text-muted)]">
                                      {Math.min(20, move.pv?.length ?? 0)} 手
                                    </span>
                                  </div>

                                  {selected && (
                                    <div className="mt-1 text-[10px] font-semibold text-[var(--ui-accent)]">
                                      变化图已显示 · 再点一次关闭
                                    </div>
                                  )}
                                </button>
                              );
                            })
                          ) : (
                            <div className="col-span-full rounded-xl border border-dashed border-[var(--ui-border)] px-3 py-3 text-center text-sm text-[var(--ui-text-muted)]">
                              正在计算前三推荐…
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </section>
            );
          };

          PersonalModeDock.displayName = 'PersonalModeDock';
          EOF

          # -------------------------------------------------------
          # 3. 修改现有源码
          # -------------------------------------------------------
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path("app")

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Patch anchor not found: {label}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("patched:", label)

          # ---------- 品牌 ----------
          index_path = root / "index.html"
          html = index_path.read_text(encoding="utf-8")
          html = html.replace('<html lang="en">', '<html lang="zh-Hans">')
          html = html.replace('<title>Web KaTrain</title>', '<title>围棋试下</title>')
          html = html.replace(
              'content="Web KaTrain is a browser-native Go study board with SGF editing, analysis, library storage, and offline-ready review tools."',
              'content="私人围棋棋盘：下棋、局势分析与 KataGo AI 指导。"'
          )
          index_path.write_text(html, encoding="utf-8")

          manifest_path = root / "public" / "manifest.webmanifest"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "围棋试下"
          manifest["short_name"] = "围棋"
          manifest["description"] = "私人围棋棋盘：下棋、局势分析与 KataGo AI 指导。"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          app_info = root / "src" / "utils" / "appInfo.ts"
          app_info_text = app_info.read_text(encoding="utf-8")
          app_info_text = app_info_text.replace("name: 'Web KaTrain'", "name: '围棋试下'", 1)
          app_info.write_text(app_info_text, encoding="utf-8")

          # ---------- 桌面顶部品牌改成中文 ----------
          dashboard_path = root / "src" / "components" / "dashboard" / "DesktopDashboard.tsx"
          dashboard_text = dashboard_path.read_text(encoding="utf-8")
          dashboard_text = dashboard_text.replace(
              '<h1 className="brand-name">Web <b>KaTrain</b></h1>',
              '<h1 className="brand-name">围棋<b>试下</b></h1>',
              1
          )
          dashboard_path.write_text(dashboard_text, encoding="utf-8")

          # ---------- 默认仍然关闭 AI ----------
          # 不把 isAnalysisMode 默认改为 true。
          # 只把旧版默认覆盖层关掉，让“下棋模式”保持干净。
          store_path = root / "src" / "store" / "gameStore.ts"
          store = store_path.read_text(encoding="utf-8")

          store = store.replace(
              "import { getPreferredAppLocaleId, isAppLocaleId } from '../utils/locales';",
              "import { isAppLocaleId } from '../utils/locales';",
              1
          )
          store = store.replace(
              "appLocale: getPreferredAppLocaleId(),",
              "appLocale: 'zh',",
              1
          )

          # 初始参数只是兜底，实际由三个模式动态切换。
          patches = [
              (r"export const DEFAULT_KATAGO_VISITS\s*=\s*\d+;", "export const DEFAULT_KATAGO_VISITS = 120;"),
              (r"katagoMaxTimeMs:\s*\d+,", "katagoMaxTimeMs: 2000,"),
              (r"katagoBatchSize:\s*\d+,", "katagoBatchSize: 4,"),
              (r"katagoTopK:\s*\d+,", "katagoTopK: 1,"),
              (r"katagoAnalysisPvLen:\s*\d+,", "katagoAnalysisPvLen: 0,"),
          ]
          for pattern, replacement in patches:
              store, count = re.subn(pattern, replacement, store, count=1)
              if count != 1:
                  raise RuntimeError(f"Expected one setting patch for {pattern}, got {count}")

          store = store.replace("analysisShowChildren: true,", "analysisShowChildren: false,", 1)
          store = store.replace("analysisShowEval: true,", "analysisShowEval: false,", 1)
          store = store.replace("analysisShowHints: true,", "analysisShowHints: false,", 1)
          store = store.replace("analysisShowOwnership: true,", "analysisShowOwnership: false,", 1)
          store_path.write_text(store, encoding="utf-8")

          # ---------- 棋盘上 AI 推荐最多只显示前三 ----------
          hints_path = root / "src" / "utils" / "analysisHints.ts"
          hints = hints_path.read_text(encoding="utf-8")
          hints = hints.replace(
              "export const ANALYSIS_HINT_LIMIT = 10;",
              "export const ANALYSIS_HINT_LIMIT = 3;",
              1
          )
          hints = hints.replace(
              "export const COMPACT_ANALYSIS_HINT_LIMIT = 5;",
              "export const COMPACT_ANALYSIS_HINT_LIMIT = 3;",
              1
          )
          hints_path.write_text(hints, encoding="utf-8")

          # ---------- Layout 接入私人模式 ----------
          layout_path = root / "src" / "components" / "Layout.tsx"

          replace_once(
              layout_path,
              "import { CandidatePvTiles } from './CandidatePvTiles';",
              "import { PersonalModeDock } from './PersonalModeDock';\n"
              "import { usePersonalModeStore } from '../store/personalModeStore';",
              "Layout imports"
          )

          replace_once(
              layout_path,
              "  const [reportHoverMove, setReportHoverMove] = useState<CandidateMove | null>(null);",
              "  const [reportHoverMove, setReportHoverMove] = useState<CandidateMove | null>(null);\n"
              "  const personalPreviewMove = usePersonalModeStore((state) => state.previewMove);",
              "personal preview selector"
          )

          replace_once(
              layout_path,
              "  const activeHoverMove = reportHoverMove ?? hoveredMove;",
              "  const activeHoverMove = personalPreviewMove ?? reportHoverMove ?? hoveredMove;",
              "personal PV overlay"
          )

          # 两个棋盘实例都允许私人 PV 强制显示。
          layout_text = layout_path.read_text(encoding="utf-8")
          force_count = layout_text.count("forcePvOverlay={!!reportHoverMove}")
          if force_count < 1:
              raise RuntimeError("No forcePvOverlay anchor found")
          layout_text = layout_text.replace(
              "forcePvOverlay={!!reportHoverMove}",
              "forcePvOverlay={!!reportHoverMove || !!personalPreviewMove}"
          )

          # 原版 CandidatePvTiles 在手机上会重复显示，我们自己的中文推荐卡片已替代它。
          # 直接删除整段 JSX，避免 TypeScript 继续检查 false && 后面的不可达代码。
          candidate_pattern = re.compile(
              r"\n\s*\{isMobile && showBoardAnalysisCommandBar && isAnalysisMode && !isEditMode && !scoringMode && \(\n"
              r"\s*<CandidatePvTiles\n"
              r"\s*pinnedKey=\{reportHoverMove \? `\$\{reportHoverMove\.x\},\$\{reportHoverMove\.y\}` : null\}\n"
              r"\s*onPin=\{setReportHoverMove\}\n"
              r"\s*/>\n"
              r"\s*\)\}"
          )
          layout_text, removed_count = candidate_pattern.subn(
              "\n            {/* 私人三模式版：候选变化由 PersonalModeDock 控制 */}",
              layout_text,
              count=1
          )
          if removed_count != 1:
              raise RuntimeError(f"Expected to remove one CandidatePvTiles block, got {removed_count}")

          # 三模式中文控制层对电脑和手机都显示。
          desktop_anchor = "      {isDesktop && (\n"
          if desktop_anchor not in layout_text:
              raise RuntimeError("Desktop render anchor not found")
          layout_text = layout_text.replace(
              desktop_anchor,
              "      <PersonalModeDock />\n\n" + desktop_anchor,
              1
          )

          layout_path.write_text(layout_text, encoding="utf-8")

          # ---------- 私人版界面清理与美化 ----------
          index_css_path = root / "src" / "index.css"
          private_css = r'''
          /* Private Go Board: the Chinese control dock replaces legacy action rails. */
          .wk-dashboard .navbar {
            display: none !important;
          }

          .mobile-bottom-controls {
            display: none !important;
          }

          :root {
            --mobile-bottom-controls-height: 0px !important;
          }

          [data-edit-toolbar] {
            display: none !important;
          }

          .wk-dashboard .analyze-toggle {
            display: none !important;
          }

          .personal-mode-dock button:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--ui-accent) 65%, transparent);
            outline-offset: 2px;
          }

          @media (max-width: 639px) {
            .personal-mode-dock {
              border-radius: 14px !important;
              margin-top: 6px !important;
              margin-bottom: 8px !important;
              padding: 8px !important;
            }
          }
          '''
          with index_css_path.open("a", encoding="utf-8") as css_file:
              css_file.write("\n" + private_css + "\n")

          # ---------- 保留开源许可 ----------
          license_text = (root / "LICENSE").read_text(encoding="utf-8")
          (root / "public" / "WEB_KATRAIN_LICENSE.txt").write_text(
              license_text,
              encoding="utf-8"
          )

          (root / "public" / "GO_BOARD_BUILD.txt").write_text(
              "围棋试下私人三模式版\n"
              "默认：下棋模式，AI关闭\n"
              "下棋工具：悔棋/前进/停一手/摆棋/研究变化/新棋局\n"
              "局势分析：120 visits / 最长2秒 / 胜率+目差\n"
              "AI指导：250 visits / 最长4秒 / Top3 / PV最多20手\n"
              "AI：浏览器本地 KataGo 风格引擎，WebGPU 优先\n",
              encoding="utf-8"
          )

          print("Private three-mode customization complete.")
          PY

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build Go Board
        working-directory: app
        env:
          VITE_BASE_URL: /go-board/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
